name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: harmonopattume-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  release:
    # Signed release build, published as a GitHub Release so the README link
    # always points to the newest APK. Skipped on pull requests (no secrets).
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APKs and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          tag="v${version}-build.${{ github.run_number }}"
          out=build/app/outputs
          mkdir -p dist
          cp $out/flutter-apk/app-arm64-v8a-release.apk dist/harmonopattume.apk
          cp $out/flutter-apk/app-armeabi-v7a-release.apk dist/harmonopattume-armv7.apk
          cp $out/flutter-apk/app-x86_64-release.apk dist/harmonopattume-x86_64.apk
          cp $out/bundle/release/app-release.aab dist/harmonopattume.aab
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "HarmonoPattume $version (build ${{ github.run_number }})" \
            --notes "Signed release built from ${{ github.sha }}. Most phones: download harmonopattume.apk. Old 32-bit phones: harmonopattume-armv7.apk." \
            --latest
